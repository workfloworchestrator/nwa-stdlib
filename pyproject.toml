[project]
name = "nwa-stdlib"
version = "1.12.1"
description = "Network Automation Standard Library."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "SURF", email = "automation-beheer@surf.nl" },
]
requires-python = ">=3.11,<3.15"
classifiers = [
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Typing :: Typed",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.11",
]
# Floors are the oldest releases that CI's `uv sync --resolution lowest-direct` actually
# resolves on the supported pythons; anything lower is silently backtracked past and so is
# never tested.
dependencies = [
    "anyio>=3.7.0",
    "colorama~=0.4.3",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.1",
    "strawberry-graphql>=0.246.2",
    "redis>=5.0,<9.0",
    "structlog>=22.1.0",
]

[project.urls]
Documentation = "https://workfloworchestrator.org/"
Homepage = "https://github.com/workfloworchestrator/nwa-stdlib"

# Local dependencies for development.
# Lower bounds are required: CI runs `uv sync --resolution lowest-direct`, which
# would otherwise resolve unbounded entries to their oldest release on PyPI.
[dependency-groups]
test = [
    "apache-license-check>=1.0.0",
    "black>=24.10.0",
    "fakeredis>=2.26.1",
    "fastapi>=0.100.0",
    "httpx>=0.27.2",
    "jsonschema>=4.23.0",
    # Pinned, and kept in lockstep with the mirrors-mypy rev in .pre-commit-config.yaml.
    "mypy==2.1.0",
    "mypy-extensions>=1.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.15.11",
    "types-redis>=4.6.0.20241004",
]
dev = ["pre-commit>=4.2.0"]

[build-system]
requires = ["uv_build>=0.10,<0.13"]
build-backend = "uv_build"

[tool.uv]
# Cooldown: don't resolve versions published in the last 3 days (supply-chain protection).
# Keep in sync with minimumReleaseAge in renovate.json.
exclude-newer = "3 days"

[tool.uv.build-backend]
module-name = "nwastdlib"
module-root = ""
# Ship the test suite in the sdist so downstream packagers can run it from the tarball.
source-include = ["tests/**"]

[tool.black]
line-length = 120
target-version = ["py311"]
exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | venv
    | src
    | build
  )/
)
'''

[tool.ruff]
exclude = [
    ".git",
    ".cache",
    ".eggs",
    "__pycache__",
    "dist",
    "src",
    "venv",
    ".venv",
    "docs",
]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "C417",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D202",
    "E501",
    "N806",
    "B905",
    "N805",
    "B904",
    "N803",
    "N801",
    "N815",
    "N802",
]
select = ["B", "C", "D", "E", "F", "I", "N", "RET", "S", "T", "W"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "B033", "N816", "N802"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-third-party = ["pydantic"]

[tool.coverage.run]
source = ["nwastdlib"]
omit = ["tests/*", "benchmarks/*"]

[tool.pytest.ini_options]
addopts = "--doctest-modules --doctest-ignore-import-errors"
norecursedirs = [".git", "build", "dist", "*.egg", "__pycache__", ".cache", ".*"]
testpaths = ["tests/", "nwastdlib"]
asyncio_mode = "auto"

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
# check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
# warn_return_any = true
warn_no_return = true
warn_unreachable = true
implicit_reexport = false
strict_equality = true
show_error_codes = true
show_column_numbers = true
exclude = "(benchmarks/.*|tests/.*)"
# lineprecision_report = mypy-coverage

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true
